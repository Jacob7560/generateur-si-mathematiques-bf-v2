
name: Construire l'APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les outils Android
        uses: android-actions/setup-android@v4

      - name: Installer le SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Compiler l'application
        run: ./gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Generateur-SI-Maths-BF
          path: app/build/outputs/apk/debug/app-debug.apk
          
